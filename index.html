<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adhi ❤️ Amrutha</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  color:#333;
}

/* Header */

header{
  text-align:center;
  padding:60px 20px;
  color:white;
}

header h1{
  font-size:36px;
  margin-bottom:10px;
}

header p{
  font-size:18px;
}

/* Container */

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* Card */

.card{
  background:white;
  border-radius:20px;
  padding:30px;
  margin-bottom:30px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
}

/* Gallery */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-top:20px;
}

.gallery img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:15px;
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* Button */

button{
  background:#ff3366;
  color:white;
  border:none;
  padding:12px 28px;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#e6004c;
}

/* Message */

#loveMessage{
  display:none;
  margin-top:20px;
  font-size:18px;
  color:#ff3366;
  font-weight:600;
}

/* Footer */

footer{
  text-align:center;
  padding:20px;
  color:white;
  font-size:14px;
}

</style>
</head>

<body>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
</audio>

<header>
  <h1>Happy Valentine's Day 💖</h1>
  <p>Adhi & Amrutha — Our Love Story</p>
</header>

<div class="container">

  <!-- Message Card -->
  <div class="card">

    <h2>My Dear Amrutha 💕</h2>

    <p>
      You make my life brighter every day.  
      You are my smile, my strength, my happiness.
      <br><br>
      Life feels perfect with you ❤️
    </p>

    <button onclick="showLove()">Click for Surprise 💌</button>

    <div id="loveMessage">
      I Love You Always 💕<br>
      Will You Be My Valentine Forever? 💍<br><br>
      — Adhi 😘
    </div>

  </div>

  <!-- Gallery Card -->
  <div class="card">

    <h2>Our Memories 📸</h2>

    <div class="gallery">
      <img src="photo1.jpg">
    </div>

  </div>

</div>

<footer>
  Made with ❤️ by Adhi
</footer>

<script>

function showLove(){

  document.getElementById("loveMessage").style.display="block";
  document.getElementById("bgMusic").play();

}

</script>

</body>
</html>
